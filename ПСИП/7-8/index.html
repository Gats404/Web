<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЛР7-8 — Адаптивная вёрстка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="flex-container">

    <div class="flex-row row-1">
      <div class="box b1">1</div>
    </div>

    <div class="main-content">
      <div class="left-side">
        <div class="flex-row sub-row-1">
          <div class="box b2">2</div>
          <div class="box b3">3</div>
        </div>

        <div class="flex-row sub-row-2">
          <!-- Карточка товара (смартфон) -->
          <div class="box b4 product-card-wrapper">
            <div class="product-card">
              <button class="favorite-btn" aria-label="В избранное">♡</button>
              <div class="product-image-container">
                <img src="img/phone.png" alt="Samsung Galaxy M32" class="product-image">
              </div>
              <div class="product-info">
                <span class="discount-badge">-12%</span>
                <div class="price-container">
                  <span class="current-price">28 990 ₽</span>
                  <span class="old-price">32 950 ₽</span>
                </div>
                <h3 class="product-title">Samsung Galaxy M32 128GB, синий</h3>
                <div class="rating-container"><div class="stars">★★★★☆</div></div>
              </div>
              <div class="card-footer">
                <div class="quantity-selector"><button>-</button><span>1</span><button>+</button></div>
                <button class="add-to-cart-btn">В КОРЗИНУ</button>
              </div>
            </div>
          </div>

          <div class="box b5">5</div>
          <div class="box b6">6</div>
          <div class="box b7">7</div>
        </div>

        <div class="flex-row sub-row-3">
          <!-- Форма настроек обратной связи -->
          <div class="box b8 form-box-wrapper">
            <div class="page-header">
              <h1>Форма обратной связи</h1>
              <span class="info-icon">ℹ️</span>
              <div class="breadcrumb">behoof:main.feedback</div>
            </div>
            <div class="form-container">
              <div class="section">
                <div class="section-title">Внешний вид</div>
                <div class="form-row">
                  <label>Показывать заголовок формы:</label>
                  <input type="checkbox" checked>
                </div>
                <div class="form-row">
                  <label>Текст заголовка:</label>
                  <input type="text" value="Форма обратной связи">
                </div>
                <div class="form-row">
                  <label>Скрывать названия полей:</label>
                  <input type="checkbox">
                </div>
                <div class="form-row">
                  <label>Вид отображения ошибок:</label>
                  <select>
                    <option>Подписи</option>
                    <option>Всплывающие окна</option>
                  </select>
                </div>
              </div>
              <div class="section">
                <div class="section-title">Настройки скриптов</div>
                <div class="form-row">
                  <label>Подключить jQuery:</label>
                  <input type="checkbox" checked>
                </div>
              </div>
              <div class="section">
                <div class="section-title">Маска ввода телефона</div>
                <div class="form-row">
                  <label>Маска ввода телефона:</label>
                  <div class="input-with-arrow">
                    <input type="text" value="+7 (___) ___-__-__">
                    <button class="arrow-btn">▼</button>
                  </div>
                </div>
                <div class="form-row">
                  <label>Placeholder телефона:</label>
                  <input type="text" value="+7 (999) 000-00-00">
                </div>
              </div>
              <div class="section">
                <div class="section-title">CAPTCHA</div>
                <div class="form-row">
                  <label>Защита от спама для гостей:</label>
                  <input type="checkbox">
                </div>
              </div>
              <div class="section">
                <div class="section-title">Файлы</div>
                <div class="form-row">
                  <label>Разрешить загрузку файлов:</label>
                  <input type="checkbox">
                </div>
              </div>
              <div class="buttons">
                <button class="btn-save">Сохранить</button>
                <button class="btn-cancel">Отменить</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="right-side">
        <div class="box b9">9</div>
      </div>
    </div>

    <div class="flex-row row-4">
      <div class="box b10">10</div>
    </div>
  </div>
</body>
</html>
