<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЛР6 — Тот же макет на Flexbox</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #ffffff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .flex-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
    }

    .flex-row { display: flex; width: 100%; }

    .box {
      background-color: #ffffff;
      border: 1px solid #bcbcbc;
      color: #333333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }

    .row-1 .box, .row-4 .box { height: 120px; }
    .b1, .b10 { width: 100%; }

    .main-content { display: flex; width: 100%; }
    .left-side  { display: flex; flex-direction: column; width: 66.666%; }
    .right-side { width: 33.333%; }

    .sub-row-1, .sub-row-3 { height: 600px; }
    .sub-row-2 { height: 120px; }

    .b2, .b3 { width: 50%; }
    .b4, .b5, .b6, .b7 { width: 25%; }
    .b8 { width: 100%; }
    .b9 { width: 100%; height: 1320px; }
  </style>
</head>
<body>
  <div class="flex-container">
    <div class="flex-row row-1">
      <div class="box b1">1</div>
    </div>

    <div class="main-content">
      <div class="left-side">
        <div class="flex-row sub-row-1">
          <div class="box b2">2</div>
          <div class="box b3">3</div>
        </div>
        <div class="flex-row sub-row-2">
          <div class="box b4">4</div>
          <div class="box b5">5</div>
          <div class="box b6">6</div>
          <div class="box b7">7</div>
        </div>
        <div class="flex-row sub-row-3">
          <div class="box b8">8</div>
        </div>
      </div>
      <div class="right-side">
        <div class="box b9">9</div>
      </div>
    </div>

    <div class="flex-row row-4">
      <div class="box b10">10</div>
    </div>
  </div>
</body>
</html>
